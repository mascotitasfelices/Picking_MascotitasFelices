<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picking Agilizado por Cliente</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-main: #f4f7f9;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --primary-dark: #0f172a;
      --brand-orange: #ff6b35;
      --accent-blue: #0284c7;
      --status-completed-bg: #dcfce7;
      --status-completed-border: #16a34a;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-dark);
      margin: 0;
      padding: 16px 12px 80px 12px;
    }

    .header-brand {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .company-name { font-size: 0.75em; font-weight: 800; color: var(--brand-orange); }
    .header-title { font-size: 1.1em; font-weight: 800; color: var(--primary-dark); }

    .btn-upload {
      background: var(--primary-dark); color: white; border: none; padding: 8px 12px; border-radius: 10px; font-size: 0.75em; font-weight: 800; cursor: pointer;
    }

    .progress-card {
      background: var(--card-bg); border-radius: 16px; padding: 12px 16px; margin-bottom: 12px; border: 1px solid #e2e8f0;
    }
    .progress-text { display: flex; justify-content: space-between; font-size: 0.8em; font-weight: 800; margin-bottom: 6px; }
    .progress-bar-bg { background: #e2e8f0; height: 10px; border-radius: 5px; overflow: hidden; }
    .progress-bar-fill { background: #16a34a; height: 100%; width: 0%; transition: width 0.3s ease; }

    .search-section { background: var(--card-bg); border-radius: 16px; padding: 12px 16px; margin-bottom: 14px; border: 1px solid #e2e8f0; }
    .search-section input { width: 100%; border: none; outline: none; font-size: 0.95em; font-weight: 500; }

    .client-list { display: flex; flex-direction: column; gap: 14px; }

    .client-card { background: var(--card-bg); border-radius: 20px; padding: 14px 16px; border: 1px solid #e2e8f0; }
    .client-card.completo { background-color: var(--status-completed-bg) !important; border: 1.5px solid var(--status-completed-border); }

    .card-main { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .card-left { display: flex; align-items: center; gap: 12px; }
    .icon-circle { width: 42px; height: 42px; border-radius: 12px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 1.1em; }
    .client-name { font-weight: 800; font-size: 0.95em; color: var(--text-dark); text-transform: uppercase; }
    .client-meta { font-size: 0.75em; color: var(--text-muted); margin-top: 2px; font-weight: 600; }

    .client-items-container { display: none; margin-top: 14px; padding-top: 12px; border-top: 1px solid #cbd5e1; flex-direction: column; gap: 10px; }
    .client-items-container.active { display: flex; }

    .item-tap-card {
      background: #ffffff; border-radius: 14px; padding: 12px; border: 2px solid #cbd5e1; cursor: pointer; user-select: none; transition: all 0.2s ease;
    }
    .item-tap-card.picked { background: #dcfce7; border-color: #16a34a; }

    .item-title { font-weight: 800; font-size: 0.9em; color: var(--primary-dark); text-transform: uppercase; margin-bottom: 4px; }
    .item-sub-info { display: flex; justify-content: space-between; font-size: 0.8em; font-weight: 700; color: var(--text-muted); }

    .checkboxes-wrapper { display: flex; gap: 16px; margin-top: 8px; border-top: 1px dashed #cbd5e1; padding-top: 6px; }
    .checkbox-action { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 0.8em; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
    .modal-overlay.active { display: flex; }
    .modal-card { background: #ffffff; border-radius: 24px; padding: 24px; width: 90%; max-width: 400px; text-align: center; }

    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .btn-modal { flex: 1; padding: 12px; border-radius: 12px; font-weight: 700; border: none; cursor: pointer; font-size: 0.85em; }
    .btn-confirm { background: var(--accent-blue); color: white; }
    .btn-cancel { background: #f1f5f9; color: var(--text-dark); }

    .toast-notification {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); background: rgba(15, 23, 42, 0.95);
      color: #ffffff; padding: 14px 28px; border-radius: 30px; font-weight: 700; font-size: 0.9em; opacity: 0; visibility: hidden; transition: all 0.25s ease; z-index: 2000;
    }
    .toast-notification.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
  </style>
</head>
<body>

  <div class="header-brand">
    <div>
      <div class="company-name">SISTEMA DE PICKING</div>
      <div class="header-title">CONTROL POR CLIENTE</div>
    </div>
    <button class="btn-upload" onclick="document.getElementById('fileExcel').click()">📄 CARGAR EXCEL</button>
    <input type="file" id="fileExcel" accept=".xlsx, .xls" style="display:none" onchange="procesarExcel(this)">
  </div>

  <div class="progress-card">
    <div class="progress-text">
      <span>PROGRESO TOTAL</span>
      <span id="progressStats">0 / 0 ÍTEMS</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>

  <div class="search-section">
    <input type="text" id="txtBuscar" placeholder="🔍 Buscar cliente, producto, DNI o comprobante..." oninput="aplicarFiltros()">
  </div>

  <div class="client-list" id="listaClientes">Cargando lista de clientes...</div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <div style="font-size:0.8em; font-weight:800; color:var(--brand-orange);">CONFIRMAR PRODUCTO EN MANO</div>
      <div style="font-size: 1.15em; font-weight:800; margin:14px 0; color:var(--primary-dark); line-height:1.3;" id="modalProductName">PRODUCTO</div>
      <div style="font-size:0.85em; color:var(--text-muted);" id="modalProductMeta">Detalles...</div>
      <div class="modal-actions">
        <button class="btn-modal btn-cancel" onclick="cerrarModal(false)">CANCELAR</button>
        <button class="btn-modal btn-confirm" onclick="cerrarModal(true)">MARCAR PICKEADO</button>
      </div>
    </div>
  </div>

  <div class="toast-notification" id="toastNotification">✓ ACTUALIZADO</div>

  <script>
    const URL_API = "https://script.google.com/macros/s/AKfycbzgfhVbc7d2r3SSjWVpeuTbSkFxAWpBgTnSw47Jnc9m-KEvpm2UADNT0ezcbUNubd9Y/exec"; 

    let productosGlobales = [];
    let accionPendiente = null;
    let acordeonesAbiertos = new Set();

    async function cargarDatos() {
      try {
        const res = await fetch(URL_API);
        productosGlobales = await res.json();
        actualizarBarraProgreso();
        agruparPorCliente(productosGlobales);
      } catch(e) {
        document.getElementById('listaClientes').innerText = "Error cargando lista.";
      }
    }

    function actualizarBarraProgreso() {
      if (productosGlobales.length === 0) return;
      const completados = productosGlobales.filter(i => Number(i.cantPickeada) >= Number(i.cantSolicitada)).length;
      const total = productosGlobales.length;
      const porcentaje = Math.round((completados / total) * 100);

      document.getElementById('progressStats').innerText = `${completados} / ${total} ÍTEMS (${porcentaje}%)`;
      document.getElementById('progressBar').style.width = `${porcentaje}%`;
    }

    function agruparPorCliente(data) {
      const mapa = {};

      data.forEach(item => {
        const key = item.docCliente || item.cliente || 'GENERAL';
        if (!mapa[key]) {
          mapa[key] = {
            keyGroup: key,
            docCliente: item.docCliente || 'S/D',
            cliente: item.cliente || 'CLIENTE GENERAL',
            fechas: new Set(),
            comprobantes: new Set(),
            importeTotal: 0,
            items: []
          };
        }
        if (item.fecha) {
          let f = String(item.fecha);
          if (f.includes("T")) f = f.split("T")[0];
          mapa[key].fechas.add(f);
        }
        if (item.comprobante) mapa[key].comprobantes.add(String(item.comprobante));
        mapa[key].importeTotal += Number(item.importe || 0);
        mapa[key].items.push(item);
      });

      renderizarListaClientes(Object.values(mapa));
    }

    function renderizarListaClientes(grupos) {
      const container = document.getElementById('listaClientes');
      container.innerHTML = '';

      if (grupos.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">Sin pedidos cargados.</div>';
        return;
      }

      grupos.forEach((grupo) => {
        const totalItems = grupo.items.length;
        const completados = grupo.items.filter(i => Number(i.cantPickeada) >= Number(i.cantSolicitada)).length;
        const clienteCompleto = totalItems > 0 && totalItems === completados;
        const estaAbierto = acordeonesAbiertos.has(grupo.keyGroup);

        const div = document.createElement('div');
        div.className = `client-card ${clienteCompleto ? 'completo' : ''}`;
        div.id = `card-group-${grupo.keyGroup}`;

        let htmlItems = '';
        grupo.items.forEach(item => {
          const esPicked = Number(item.cantPickeada) >= Number(item.cantSolicitada);
          const verificadoEmpacado = item.manojo === true || item.manojo === "TRUE";
          const tieneObservacion = item.observacion === true || item.observacion === "TRUE";

          htmlItems += `
            <div class="item-tap-card ${esPicked ? 'picked' : ''}" id="item-card-${item.fila}">
              <div onclick="confirmarToqueItem(${item.fila}, '${item.producto.replace(/'/g, "\\'")}', ${item.cantSolicitada}, '${item.codigo}', '${grupo.keyGroup}')">
                <div class="item-title" id="item-title-${item.fila}">${esPicked ? '✅' : '📦'} ${item.producto}</div>
                <div class="item-sub-info">
                  <span>CÓD: ${item.codigo || '—'}</span>
                  <span>CANT: ${item.cantSolicitada} ${item.unidad || 'EA'}</span>
                </div>
              </div>

              <div class="checkboxes-wrapper" onclick="event.stopPropagation()">
                <div class="checkbox-action">
                  <input type="checkbox" ${verificadoEmpacado ? 'checked' : ''} onclick="cambiarEstadoEmpaque(this, ${item.fila})">
                  <span>EMPACADO</span>
                </div>
                <div class="checkbox-action">
                  <input type="checkbox" ${tieneObservacion ? 'checked' : ''} onclick="cambiarEstadoObs(this, ${item.fila})">
                  <span>OBSERVACIÓN</span>
                </div>
              </div>
            </div>
          `;
        });

        const arrComprobantes = Array.from(grupo.comprobantes).join(', ');
        const arrFechas = Array.from(grupo.fechas).join(', ');

        div.innerHTML = `
          <div class="card-main" onclick="toggleAcordeon('${grupo.keyGroup}')">
            <div class="card-left">
              <div class="icon-circle" id="client-icon-${grupo.keyGroup}">${clienteCompleto ? '✅' : '👤'}</div>
              <div>
                <div class="client-name">${grupo.cliente}</div>
                <div class="client-meta">DOC: ${grupo.docCliente} | FECHA: ${arrFechas}</div>
                <div class="client-meta">COMP: ${arrComprobantes} (${grupo.comprobantes.size}) | TOTAL: S/ ${grupo.importeTotal.toFixed(2)}</div>
                <div class="client-meta" id="progreso-text-${grupo.keyGroup}" style="color:var(--brand-orange);">PROGRESO: ${completados}/${totalItems} ÍTEMS</div>
              </div>
            </div>
            <div style="font-size:0.8em; color:var(--text-muted);" id="icon-arrow-${grupo.keyGroup}">${estaAbierto ? '▲' : '▼'}</div>
          </div>

          <div class="client-items-container ${estaAbierto ? 'active' : ''}" id="items-group-${grupo.keyGroup}">
            ${htmlItems}
          </div>
        `;
        container.appendChild(div);
      });
    }

    function toggleAcordeon(keyGroup) {
      const container = document.getElementById(`items-group-${keyGroup}`);
      const arrow = document.getElementById(`icon-arrow-${keyGroup}`);
      if (acordeonesAbiertos.has(keyGroup)) {
        acordeonesAbiertos.delete(keyGroup);
        if (container) container.classList.remove('active');
        if (arrow) arrow.innerText = '▼';
      } else {
        acordeonesAbiertos.add(keyGroup);
        if (container) container.classList.add('active');
        if (arrow) arrow.innerText = '▲';
      }
    }

    function confirmarToqueItem(fila, nombre, solicitada, codigo, keyGroup) {
      const itemObj = productosGlobales.find(p => p.fila === fila);
      const yaPickeado = Number(itemObj.cantPickeada) >= Number(solicitada);

      abrirModal(
        nombre,
        `Código Item: <b>${codigo}</b><br>Cantidad Requerida: <b>${solicitada}</b><br><br>${yaPickeado ? '¿Desmarcar producto?' : '¿Confirmar producto recolectado?'}`,
        async (conf) => {
          if (conf) {
            const res = await fetch(URL_API, { method: 'POST', body: JSON.stringify({ accion: "TOGGLE_PICKING", fila: fila }) });
            const data = await res.json();
            if (data.status === 'ok') {
              itemObj.cantPickeada = data.nuevoPick;
              itemObj.estado = data.estado;
              
              const esPicked = Number(data.nuevoPick) >= Number(solicitada);
              const cardElem = document.getElementById(`item-card-${fila}`);
              const titleElem = document.getElementById(`item-title-${fila}`);
              
              if (cardElem) {
                if (esPicked) cardElem.classList.add('picked');
                else cardElem.classList.remove('picked');
              }
              if (titleElem) {
                titleElem.innerHTML = `${esPicked ? '✅' : '📦'} ${itemObj.producto}`;
              }

              actualizarBarraProgreso();
              
              const itemsCliente = productosGlobales.filter(p => (p.docCliente || p.cliente || 'GENERAL') === keyGroup);
              const total = itemsCliente.length;
              const comp = itemsCliente.filter(i => Number(i.cantPickeada) >= Number(i.cantSolicitada)).length;
              
              const progElem = document.getElementById(`progreso-text-${keyGroup}`);
              const iconElem = document.getElementById(`client-icon-${keyGroup}`);
              const cardGroup = document.getElementById(`card-group-${keyGroup}`);

              if (progElem) progElem.innerText = `PROGRESO: ${comp}/${total} ÍTEMS`;
              if (comp === total && total > 0) {
                if (iconElem) iconElem.innerText = '✅';
                if (cardGroup) cardGroup.classList.add('completo');
              } else {
                if (iconElem) iconElem.innerText = '👤';
                if (cardGroup) cardGroup.classList.remove('completo');
              }

              mostrarToast("✓ ESTADO ACTUALIZADO");
            }
          }
        }
      );
    }

    async function cambiarEstadoEmpaque(chk, fila) {
      await fetch(URL_API, { method: 'POST', body: JSON.stringify({ accion: "VERIFICAR_EMPAQUE", fila: fila, manojo: chk.checked }) });
      mostrarToast();
    }

    async function cambiarEstadoObs(chk, fila) {
      await fetch(URL_API, { method: 'POST', body: JSON.stringify({ accion: "OBSERVACION", fila: fila, observacion: chk.checked }) });
      mostrarToast();
    }

    function aplicarFiltros() {
      const texto = document.getElementById('txtBuscar').value.toLowerCase().trim();
      const filtrados = productosGlobales.filter(item => {
        return (item.cliente && item.cliente.toLowerCase().includes(texto)) ||
               (item.docCliente && String(item.docCliente).includes(texto)) ||
               (item.producto && item.producto.toLowerCase().includes(texto)) ||
               (item.comprobante && String(item.comprobante).toLowerCase().includes(texto));
      });
      agruparPorCliente(filtrados);
    }

    async function procesarExcel(input) {
      if (!input.files.length) return;
      mostrarToast("Procesando Excel...");
      const data = await input.files[0].arrayBuffer();
      const workbook = XLSX.read(data, { type: 'array' });
      const rawData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);

      const vistasUnicas = new Set();
      const rows = [];

      rawData.forEach(r => {
        const cantidad = Number(r['CANTIDAD'] || 0);
        if (cantidad <= 0) return;

        const serie = r['SERIE'] || '';
        const numero = r['NUMERO'] || '';
        const codigo = r['CODIGO ITEM'] || '';
        const comprobante = `${serie}-${numero}`;

        const claveUnica = `${comprobante}_${codigo}`;
        if (vistasUnicas.has(claveUnica)) return;
        vistasUnicas.add(claveUnica);

        rows.push([
          r['FECHA'] || '',
          r['DOC CLIENTE'] || 'S/D',
          r['CLIENTE'] || 'CLIENTE GENERAL',
          comprobante,
          codigo || 'S/C',
          r['DESCRIPCION'] || 'SIN DESCRIPCION',
          r['CATEGORIA'] || 'GENERAL',
          r['UNIDAD MEDIDA'] || 'EA',
          cantidad,
          r['IMPORTE'] || 0,
          0, false, false, "PENDIENTE"
        ]);
      });

      await fetch(URL_API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ rows: rows }) });
      mostrarToast("¡Carga completa!");
      cargarDatos();
    }

    function abrirModal(nombre, meta, callback) {
      document.getElementById('modalProductName').innerText = nombre;
      document.getElementById('modalProductMeta').innerHTML = meta;
      document.getElementById('modalOverlay').classList.add('active');
      accionPendiente = callback;
    }

    function cerrarModal(confirmado) {
      document.getElementById('modalOverlay').classList.remove('active');
      if (accionPendiente) { accionPendiente(confirmado); accionPendiente = null; }
    }

    function mostrarToast(txt = "✓ REGISTRADO") {
      const toast = document.getElementById('toastNotification');
      toast.innerText = txt;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 1800);
    }

    cargarDatos();
  </script>
</body>
</html>
