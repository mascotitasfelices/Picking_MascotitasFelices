<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picking Agilizado por Cliente</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-main: #f4f7f9;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --primary-dark: #0f172a;
      --brand-orange: #ff6b35;
      --accent-blue: #0284c7;
      --status-completed-bg: #dcfce7;
      --status-completed-border: #16a34a;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-dark);
      margin: 0;
      padding: 16px 12px 80px 12px;
    }

    .header-brand {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .company-name { font-size: 0.75em; font-weight: 800; color: var(--brand-orange); }
    .header-title { font-size: 1.1em; font-weight: 800; color: var(--primary-dark); }

    .btn-upload {
      background: var(--primary-dark); color: white; border: none; padding: 8px 12px; border-radius: 10px; font-size: 0.75em; font-weight: 800; cursor: pointer;
    }

    .progress-card {
      background: var(--card-bg); border-radius: 16px; padding: 12px 16px; margin-bottom: 12px; border: 1px solid #e2e8f0;
    }
    .progress-text { display: flex; justify-content: space-between; font-size: 0.8em; font-weight: 800; margin-bottom: 6px; }
    .progress-bar-bg { background: #e2e8f0; height: 10px; border-radius: 5px; overflow: hidden; }
    .progress-bar-fill { background: #16a34a; height: 100%; width: 0%; transition: width 0.3s ease; }

    .search-section { background: var(--card-bg); border-radius: 16px; padding: 12px 16px; margin-bottom: 14px; border: 1px solid #e2e8f0; }
    .search-section input { width: 100%; border: none; outline: none; font-size: 0.95em; font-weight: 500; }

    .client-list { display: flex; flex-direction: column; gap: 14px; }

    .client-card { background: var(--card-bg); border-radius: 20px; padding: 14px 16px; border: 1px solid #e2e8f0; }
    .client-card.completo { background-color: var(--status-completed-bg) !important; border: 1.5px solid var(--status-completed-border); }

    .card-main { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .card-left { display: flex; align-items: center; gap: 12px; width: 100%; }
    .icon-circle { width: 42px; height: 42px; border-radius: 12px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 1.1em; flex-shrink: 0; }
    
    .client-header-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .client-name { font-weight: 800; font-size: 0.95em; color: var(--text-dark); text-transform: uppercase; }
    
    /* Nueva sección de etiquetas al lado del nombre */
    .tags-container { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .tag-btn {
      font-size: 0.68em; font-weight: 700; padding: 4px 8px; border-radius: 8px; border: 1px solid #cbd5e1;
      background: #f8fafc; color: #475569; cursor: pointer; user-select: none; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 4px;
    }
    .tag-btn.active { background: #0284c7; color: white; border-color: #0369a1; }
    .tag-btn.active.despachado { background: #16a34a; border-color: #15803d; }
    .tag-btn.active.acumular { background: #d97706; border-color: #b45309; }
    .tag-date-input { font-size: 0.75em; padding: 2px 4px; border-radius: 6px; border: 1px solid #0284c7; outline: none; }

    .client-meta { font-size: 0.75em; color: var(--text-muted); margin-top: 2px; font-weight: 600; }

    .client-items-container { display: none; margin-top: 14px; padding-top: 12px; border-top: 1px solid #cbd5e1; flex-direction: column; gap: 10px; }
    .client-items-container.active { display: flex; }

    .item-tap-card {
      background: #ffffff; border-radius: 14px; padding: 12px; border: 2px solid #cbd5e1; cursor: pointer; user-select: none; transition: all 0.2s ease;
    }
    .item-tap-card.picked { background: #dcfce7; border-color: #16a34a; }

    .item-title { font-weight: 800; font-size: 0.9em; color: var(--primary-dark); text-transform: uppercase; margin-bottom: 4px; }
    .item-sub-info { display: flex; justify-content: space-between; font-size: 0.8em; font-weight: 700; color: var(--text-muted); }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
    .modal-overlay.active { display: flex; }
    .modal-card { background: #ffffff; border-radius: 24px; padding: 24px; width: 90%; max-width: 440px; text-align: center; max-height: 85vh; display: flex; flex-direction: column; }

    .modal-body-scroll { overflow-y: auto; text-align: left; margin: 10px 0; padding-right: 4px; }

    .modal-actions { display: flex; gap: 10px; margin-top: 12px; }
    .btn-modal { flex: 1; padding: 12px; border-radius: 12px; font-weight: 700; border: none; cursor: pointer; font-size: 0.85em; }
    .btn-confirm { background: var(--accent-blue); color: white; }
    .btn-cancel { background: #f1f5f9; color: var(--text-dark); }
    .btn-close-only { background: var(--primary-dark); color: white; width: 100%; }

    .toast-notification {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); background: rgba(15, 23, 42, 0.95);
      color: #ffffff; padding: 14px 28px; border-radius: 30px; font-weight: 700; font-size: 0.9em; opacity: 0; visibility: hidden; transition: all 0.25s ease; z-index: 2000; text-align: center; max-width: 80%;
    }
    .toast-notification.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

    .list-rejected { font-size: 0.78em; background: #fff1f2; color: #9f1239; border: 1px solid #fecdd3; padding: 8px 12px; border-radius: 8px; margin-top: 6px; max-height: 120px; overflow-y: auto; }
  </style>
</head>
<body>

  <div class="header-brand">
    <div>
      <div class="company-name">SISTEMA DE PICKING</div>
      <div class="header-title">CONTROL POR CLIENTE</div>
    </div>
    <button class="btn-upload" onclick="document.getElementById('fileExcel').click()">➕ AGREGAR EXCEL</button>
    <input type="file" id="fileExcel" accept=".xlsx, .xls" style="display:none" onchange="procesarExcel(this)">
  </div>

  <div class="progress-card">
    <div class="progress-text">
      <span>PROGRESO TOTAL</span>
      <span id="progressStats">0 / 0 ÍTEMS</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>

  <div class="search-section">
    <input type="text" id="txtBuscar" placeholder="🔍 Buscar cliente, producto, DNI o comprobante..." oninput="aplicarFiltros()">
  </div>

  <div class="client-list" id="listaClientes">Cargando lista de clientes...</div>

  <div class="modal-overlay" id="modalOverlay" onclick="cerrarAlClickearFondo(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div style="font-size:0.8em; font-weight:800; color:var(--brand-orange);" id="modalTag">CONFIRMAR PRODUCTO EN MANO</div>
      <div style="font-size: 1.15em; font-weight:800; margin:8px 0; color:var(--primary-dark); line-height:1.3;" id="modalProductName">PRODUCTO</div>
      
      <div class="modal-body-scroll" id="modalProductMeta">Detalles...</div>
      
      <div class="modal-actions" id="modalActions">
        <button class="btn-modal btn-cancel" onclick="cerrarModal(false)">CANCELAR</button>
        <button class="btn-modal btn-confirm" onclick="cerrarModal(true)">MARCAR PICKEADO</button>
      </div>

      <div class="modal-actions" id="modalCloseOnly" style="display:none;">
        <button class="btn-modal btn-close-only" onclick="cerrarModal(false)">ENTENDIDO / CERRAR</button>
      </div>
    </div>
  </div>

  <div class="toast-notification" id="toastNotification">✓ ACTUALIZADO</div>

  <script>
    const URL_API = "https://script.google.com/macros/s/AKfycbzgfhVbc7d2r3SSjWVpeuTbSkFxAWpBgTnSw47Jnc9m-KEvpm2UADNT0ezcbUNubd9Y/exec"; 

    let productosGlobales = [];
    let accionPendiente = null;
    let acordeonesAbiertos = new Set();
    let estadoEtiquetasClientes = {}; // Guarda localmente el estado de las etiquetas por cliente

    function normalizarKey(val) {
      return String(val || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '_');
    }

    async function cargarDatos() {
      try {
        const res = await fetch(URL_API);
        productosGlobales = await res.json();
        actualizarBarraProgreso();
        agruparPorCliente(productosGlobales);
      } catch(e) {
        document.getElementById('listaClientes').innerText = "Error cargando lista.";
      }
    }

    function actualizarBarraProgreso() {
      if (productosGlobales.length === 0) return;
      const completados = productosGlobales.filter(i => Number(i.cantPickeada) >= Number(i.cantSolicitada)).length;
      const total = productosGlobales.length;
      const porcentaje = Math.round((completados / total) * 100);

      document.getElementById('progressStats').innerText = `${completados} / ${total} ÍTEMS (${porcentaje}%)`;
      document.getElementById('progressBar').style.width = `${porcentaje}%`;
    }

    function agruparPorCliente(data) {
      const mapa = {};

      data.forEach(item => {
        const keyRaw = item.docCliente || item.cliente || 'GENERAL';
        const keyGroup = normalizarKey(keyRaw);

        if (!mapa[keyGroup]) {
          mapa[keyGroup] = {
            keyGroup: keyGroup,
            docCliente: item.docCliente || 'S/D',
            cliente: item.cliente || 'CLIENTE GENERAL',
            fechas: new Set(),
            comprobantes: new Set(),
            importeTotal: 0,
            items: []
          };
        }
        if (item.fecha) {
          let f = String(item.fecha);
          if (f.includes("T")) f = f.split("T")[0];
          mapa[keyGroup].fechas.add(f);
        }
        if (item.comprobante) mapa[keyGroup].comprobantes.add(String(item.comprobante));
        mapa[keyGroup].importeTotal += Number(item.importe || 0);
        mapa[keyGroup].items.push(item);
      });

      renderizarListaClientes(Object.values(mapa));
    }

    function renderizarListaClientes(grupos) {
      const container = document.getElementById('listaClientes');
      container.innerHTML = '';

      if (grupos.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">Sin pedidos cargados.</div>';
        return;
      }

      grupos.forEach((grupo) => {
        const totalItems = grupo.items.length;
        const completados = grupo.items.filter(i => Number(i.cantPickeada) >= Number(i.cantSolicitada)).length;
        const clienteCompleto = totalItems > 0 && totalItems === completados;
        const estaAbierto = acordeonesAbiertos.has(grupo.keyGroup);

        if (!estadoEtiquetasClientes[grupo.keyGroup]) {
          estadoEtiquetasClientes[grupo.keyGroup] = {
            proximoDespacho: false,
            fechaDespacho: '',
            acumular: false,
            delivery: false,
            recojoLocal: false,
            despachado: false
          };
        }
        const state = estadoEtiquetasClientes[grupo.keyGroup];

        const div = document.createElement('div');
        div.className = `client-card ${clienteCompleto ? 'completo' : ''}`;
        div.id = `card-group-${grupo.keyGroup}`;

        let htmlItems = '';
        grupo.items.forEach(item => {
          const esPicked = Number(item.cantPickeada) >= Number(item.cantSolicitada);

          htmlItems += `
            <div class="item-tap-card ${esPicked ? 'picked' : ''}" id="item-card-${item.fila}">
              <div onclick="confirmarToqueItem(${item.fila}, '${item.producto.replace(/'/g, "\\'")}', ${item.cantSolicitada}, '${item.codigo}', '${grupo.keyGroup}')">
                <div class="item-title" id="item-title-${item.fila}">${esPicked ? '✅' : '📦'} ${item.producto}</div>
                <div class="item-sub-info">
                  <span>CÓD: ${item.codigo || '—'}</span>
                  <span>CANT: ${item.cantSolicitada} ${item.unidad || 'EA'}</span>
                </div>
              </div>
            </div>
          `;
        });

        const arrComprobantes = Array.from(grupo.comprobantes).join(', ');
        const arrFechas = Array.from(grupo.fechas).join(', ');

        div.innerHTML = `
          <div class="card-main">
            <div class="card-left" onclick="toggleAcordeon('${grupo.keyGroup}')">
              <div class="icon-circle" id="client-icon-${grupo.keyGroup}">${clienteCompleto ? '✅' : '👤'}</div>
              <div style="width:100%;">
                <div class="client-header-title">
                  <span class="client-name">${grupo.cliente}</span>
                  
                  <div class="tags-container" onclick="event.stopPropagation()">
                    <button class="tag-btn ${state.proximoDespacho ? 'active' : ''}" onclick="toggleEtiqueta('${grupo.keyGroup}', 'proximoDespacho')">
                      📅 PRÓXIMO DESPACHO
                    </button>
                    ${state.proximoDespacho ? `
                      <input type="date" class="tag-date-input" value="${state.fechaDespacho}" onchange="guardarFechaDespacho('${grupo.keyGroup}', this.value)">
                    ` : ''}

                    <button class="tag-btn acumular ${state.acumular ? 'active' : ''}" onclick="toggleEtiqueta('${grupo.keyGroup}', 'acumular')">
                      📦 ACUMULAR
                    </button>

                    <button class="tag-btn ${state.delivery ? 'active' : ''}" onclick="toggleEtiqueta('${grupo.keyGroup}', 'delivery')">
                      🛵 DELIVERY
                    </button>

                    <button class="tag-btn ${state.recojoLocal ? 'active' : ''}" onclick="toggleEtiqueta('${grupo.keyGroup}', 'recojoLocal')">
                      🏪 RECOJO EN LOCAL
                    </button>

                    <button class="tag-btn despachado ${state.despachado ? 'active' : ''}" onclick="toggleEtiqueta('${grupo.keyGroup}', 'despachado')">
                      🚀 DESPACHADO
                    </button>
                  </div>
                </div>

                <div class="client-meta">DOC: ${grupo.docCliente} | FECHA: ${arrFechas}</div>
                <div class="client-meta">COMP: ${arrComprobantes} (${grupo.comprobantes.size}) | TOTAL: S/ ${grupo.importeTotal.toFixed(2)}</div>
                <div class="client-meta" id="progreso-text-${grupo.keyGroup}" style="color:var(--brand-orange);">PROGRESO: ${completados}/${totalItems} ÍTEMS</div>
              </div>
            </div>
            <div style="font-size:0.8em; color:var(--text-muted); padding-left:8px;" id="icon-arrow-${grupo.keyGroup}" onclick="toggleAcordeon('${grupo.keyGroup}')">${estaAbierto ? '▲' : '▼'}</div>
          </div>

          <div class="client-items-container ${estaAbierto ? 'active' : ''}" id="items-group-${grupo.keyGroup}">
            ${htmlItems}
          </div>
        `;
        container.appendChild(div);
      });
    }

    function toggleEtiqueta(keyGroup, keyTag) {
      if (!estadoEtiquetasClientes[keyGroup]) return;
      estadoEtiquetasClientes[keyGroup][keyTag] = !estadoEtiquetasClientes[keyGroup][keyTag];
      agruparPorCliente(productosGlobales);
      mostrarToast("✓ ETIQUETA ACTUALIZADA");
    }

    function guardarFechaDespacho(keyGroup, fechaVal) {
      if (!estadoEtiquetasClientes[keyGroup]) return;
      estadoEtiquetasClientes[keyGroup].fechaDespacho = fechaVal;
      mostrarToast("✓ FECHA REGISTRADA: " + fechaVal);
    }

    function toggleAcordeon(keyGroup) {
      const container = document.getElementById(`items-group-${keyGroup}`);
      const arrow = document.getElementById(`icon-arrow-${keyGroup}`);
      if (acordeonesAbiertos.has(keyGroup)) {
        acordeonesAbiertos.delete(keyGroup);
        if (container) container.classList.remove('active');
        if (arrow) arrow.innerText = '▼';
      } else {
        acordeonesAbiertos.add(keyGroup);
        if (container) container.classList.add('active');
        if (arrow) arrow.innerText = '▲';
      }
    }

    function confirmarToqueItem(fila, nombre, solicitada, codigo, keyGroup) {
      const itemObj = productosGlobales.find(p => p.fila === fila);
      const yaPickeado = Number(itemObj.cantPickeada) >= Number(solicitada);

      abrirModal(
        "CONFIRMAR PRODUCTO EN MANO",
        nombre,
        `Código Item: <b>${codigo}</b><br>Cantidad Requerida: <b>${solicitada}</b><br><br>${yaPickeado ? '¿Desmarcar producto?' : '¿Confirmar producto recolectado?'}`,
        true,
        async (conf) => {
          if (conf) {
            const res = await fetch(URL_API, { method: 'POST', body: JSON.stringify({ accion: "TOGGLE_PICKING", fila: fila }) });
            const data = await res.json();
            if (data.status === 'ok') {
              itemObj.cantPickeada = data.nuevoPick;
              itemObj.estado = data.estado;
              
              const esPicked = Number(data.nuevoPick) >= Number(solicitada);
              const cardElem = document.getElementById(`item-card-${fila}`);
              const titleElem = document.getElementById(`item-title-${fila}`);
              
              if (cardElem) {
                if (esPicked) cardElem.classList.add('picked');
                else cardElem.classList.remove('picked');
              }
              if (titleElem) {
                titleElem.innerHTML = `${esPicked ? '✅' : '📦'} ${itemObj.producto}`;
              }

              actualizarBarraProgreso();
              
              const itemsCliente = productosGlobales.filter(p => {
                const k = normalizarKey(p.docCliente || p.cliente || 'GENERAL');
                return k === keyGroup;
              });

              const total = itemsCliente.length;
              const comp = itemsCliente.filter(i => Number(i.cantPickeada) >= Number(i.cantSolicitada)).length;
              
              const progElem = document.getElementById(`progreso-text-${keyGroup}`);
              const iconElem = document.getElementById(`client-icon-${keyGroup}`);
              const cardGroup = document.getElementById(`card-group-${keyGroup}`);

              if (progElem) progElem.innerText = `PROGRESO: ${comp}/${total} ÍTEMS`;
              if (comp === total && total > 0) {
                if (iconElem) iconElem.innerText = '✅';
                if (cardGroup) cardGroup.classList.add('completo');
              } else {
                if (iconElem) iconElem.innerText = '👤';
                if (cardGroup) cardGroup.classList.remove('completo');
              }

              mostrarToast("✓ ESTADO ACTUALIZADO");
            }
          }
        }
      );
    }

    function aplicarFiltros() {
      const texto = document.getElementById('txtBuscar').value.toLowerCase().trim();
      const filtrados = productosGlobales.filter(item => {
        return (item.cliente && item.cliente.toLowerCase().includes(texto)) ||
               (item.docCliente && String(item.docCliente).includes(texto)) ||
               (item.producto && item.producto.toLowerCase().includes(texto)) ||
               (item.comprobante && String(item.comprobante).toLowerCase().includes(texto));
      });
      agruparPorCliente(filtrados);
    }

    async function procesarExcel(input) {
      if (!input.files.length) return;
      mostrarToast("Procesando archivo Excel...");
      
      const data = await input.files[0].arrayBuffer();
      const workbook = XLSX.read(data, { type: 'array' });
      const rawData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);

      const comprobantesExistentes = new Set();
      productosGlobales.forEach(p => {
        if (p.comprobante) {
          comprobantesExistentes.add(String(p.comprobante).trim().toUpperCase());
        }
      });

      const rowsAInsertar = [];
      const dupesDetalle = new Set();
      const cerosDetalle = [];

      rawData.forEach(r => {
        const cantidad = Number(r['CANTIDAD'] || 0);
        const productoNombre = r['DESCRIPCION'] || 'Producto Sin Nombre';
        const serie = r['SERIE'] || '';
        const numero = r['NUMERO'] || '';
        const comprobante = `${serie}-${numero}`.trim().toUpperCase();

        if (cantidad <= 0) {
          cerosDetalle.push(`${comprobante}: ${productoNombre}`);
          return;
        }

        if (comprobantesExistentes.has(comprobante)) {
          dupesDetalle.add(comprobante);
          return;
        }

        rowsAInsertar.push([
          r['FECHA'] || '',
          r['DOC CLIENTE'] || 'S/D',
          r['CLIENTE'] || 'CLIENTE GENERAL',
          comprobante,
          r['CODIGO ITEM'] || 'S/C',
          productoNombre,
          r['CATEGORIA'] || 'GENERAL',
          r['UNIDAD MEDIDA'] || 'EA',
          cantidad,
          r['IMPORTE'] || 0,
          0, false, false, "PENDIENTE"
        ]);
      });

      const arrDupes = Array.from(dupesDetalle);

      let htmlReporte = `<div style="font-size:0.9em; margin-bottom:10px;">Se agregaron <b>${rowsAInsertar.length}</b> nuevos ítems.</div>`;

      if (arrDupes.length > 0 || cerosDetalle.length > 0) {
        htmlReporte += `<div style="font-weight:800; font-size:0.85em; margin-top:8px; color:#9f1239;">DETALLE DE RECHAZADOS:</div>`;
        
        if (arrDupes.length > 0) {
          htmlReporte += `<div style="font-size:0.8em; font-weight:700; margin-top:4px;">• Comprobantes ya subidos previamente (${arrDupes.length}):</div>`;
          htmlReporte += `<div class="list-rejected">${arrDupes.join('<br>')}</div>`;
        }

        if (cerosDetalle.length > 0) {
          htmlReporte += `<div style="font-size:0.8em; font-weight:700; margin-top:6px;">• Ítems con Cantidad 0 (${cerosDetalle.length}):</div>`;
          htmlReporte += `<div class="list-rejected">${cerosDetalle.slice(0, 15).join('<br>')}${cerosDetalle.length > 15 ? '<br>...y más' : ''}</div>`;
        }
      }

      if (rowsAInsertar.length > 0) {
        await fetch(URL_API, { 
          method: 'POST', 
          headers: { 'Content-Type': 'text/plain' }, 
          body: JSON.stringify({ rows: rowsAInsertar }) 
        });
      }

      abrirModal("REPORTE DE CARGA", "Proceso Finalizado", htmlReporte, false);
      input.value = "";
      cargarDatos();
    }

    function abrirModal(tag, nombre, meta, conBotones = true, callback = null) {
      document.getElementById('modalTag').innerText = tag;
      document.getElementById('modalProductName').innerText = nombre;
      document.getElementById('modalProductMeta').innerHTML = meta;
      
      const actions = document.getElementById('modalActions');
      const closeOnly = document.getElementById('modalCloseOnly');

      if (conBotones) {
        actions.style.display = 'flex';
        closeOnly.style.display = 'none';
      } else {
        actions.style.display = 'none';
        closeOnly.style.display = 'flex';
      }
      
      document.getElementById('modalOverlay').classList.add('active');
      accionPendiente = callback;
    }

    function cerrarModal(confirmado) {
      document.getElementById('modalOverlay').classList.remove('active');
      if (accionPendiente) { accionPendiente(confirmado); accionPendiente = null; }
    }

    function cerrarAlClickearFondo(e) {
      if (e.target.id === 'modalOverlay') {
        cerrarModal(false);
      }
    }

    function mostrarToast(txt = "✓ REGISTRADO") {
      const toast = document.getElementById('toastNotification');
      toast.innerText = txt;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 2000);
    }

    cargarDatos();
  </script>
</body>
</html>
