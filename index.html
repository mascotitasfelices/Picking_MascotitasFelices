<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Picking Agilizado por Cliente y Comprobante</title>
  
  <!-- CONFIGURACIÓN PWA Y LOGO DESDE GOOGLE DRIVE -->
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/15UU95djdzlxZErpFFqwHfXPMukffnN-f">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/15UU95djdzlxZErpFFqwHfXPMukffnN-f">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Picking App">

  <!-- MANIFEST DE LA PWA EMBEBIDO -->
  <link rel="manifest" href='data:application/manifest+json,{
    "name": "Control de Picking",
    "short_name": "Picking App",
    "start_url": "./",
    "display": "standalone",
    "background_color": "#0f172a",
    "theme_color": "#0f172a",
    "orientation": "portrait",
    "icons": [
      {
        "src": "https://lh3.googleusercontent.com/d/15UU95djdzlxZErpFFqwHfXPMukffnN-f",
        "sizes": "192x192",
        "type": "image/png",
        "purpose": "any maskable"
      },
      {
        "src": "https://lh3.googleusercontent.com/d/15UU95djdzlxZErpFFqwHfXPMukffnN-f",
        "sizes": "512x512",
        "type": "image/png",
        "purpose": "any maskable"
      }
    ]
  }'>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-main: #f4f7f9;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --primary-dark: #0f172a;
      --brand-orange: #ff6b35;
      --accent-blue: #0284c7;
      --status-completed-bg: #dcfce7;
      --status-completed-border: #16a34a;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-dark);
      margin: 0;
      padding: 16px 12px 80px 12px;
      user-select: none;
    }

    .pin-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--primary-dark);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 5000;
      color: white;
      padding: 20px;
    }

    .pin-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .app-logo-pin {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 12px;
      border-radius: 16px;
    }

    .pin-input {
      width: 100%;
      font-size: 2em;
      letter-spacing: 12px;
      text-align: center;
      padding: 10px;
      border-radius: 12px;
      border: 2px solid #475569;
      background: #0f172a;
      color: #38bdf8;
      margin: 16px 0;
      outline: none;
    }

    .pin-btn {
      width: 100%;
      padding: 12px;
      background: var(--brand-orange);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1em;
      cursor: pointer;
    }

    .pin-error {
      color: #f87171;
      font-size: 0.85em;
      font-weight: 700;
      margin-top: 10px;
      display: none;
    }

    .app-content { display: none; }

    .header-brand {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .header-logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-logo-img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 8px;
    }

    .company-name { font-size: 0.75em; font-weight: 800; color: var(--brand-orange); }
    .header-title { font-size: 1.05em; font-weight: 800; color: var(--primary-dark); }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-install {
      background: var(--brand-orange);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.75em;
      font-weight: 800;
      cursor: pointer;
      display: none;
    }

    .btn-upload {
      background: var(--primary-dark); color: white; border: none; padding: 8px 12px; border-radius: 10px; font-size: 0.75em; font-weight: 800; cursor: pointer;
    }

    .progress-card {
      background: var(--card-bg); border-radius: 16px; padding: 12px 16px; margin-bottom: 12px; border: 1px solid #e2e8f0;
    }
    .progress-text { display: flex; justify-content: space-between; font-size: 0.8em; font-weight: 800; margin-bottom: 6px; }
    .progress-bar-bg { background: #e2e8f0; height: 10px; border-radius: 5px; overflow: hidden; }
    .progress-bar-fill { background: #16a34a; height: 100%; width: 0%; transition: width 0.3s ease; }

    .search-section {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 14px;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-input-box input { width: 100%; border: none; outline: none; font-size: 0.95em; font-weight: 500; }

    .filter-controls-row {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-top: 8px; border-top: 1px dashed #e2e8f0;
    }

    .filter-control-group { display: flex; align-items: center; gap: 4px; font-size: 0.75em; font-weight: 700; color: var(--text-muted); }
    .filter-control-group select, .filter-control-group input[type="date"] {
      border: 1px solid #cbd5e1; border-radius: 8px; padding: 4px 8px; font-size: 0.85em; outline: none; background: white; color: var(--text-dark);
    }

    .checkbox-filter {
      display: flex; align-items: center; gap: 6px; font-size: 0.75em; font-weight: 800; color: #0369a1; background: #e0f2fe; padding: 4px 8px; border-radius: 8px; cursor: pointer;
    }

    .btn-clear-filters {
      font-size: 0.72em; font-weight: 700; padding: 5px 10px; border-radius: 8px; border: none; background: #fee2e2; color: #991b1b; cursor: pointer; margin-left: auto;
    }

    .client-list { display: flex; flex-direction: column; gap: 14px; }
    .client-card { background: var(--card-bg); border-radius: 20px; padding: 14px 16px; border: 1px solid #e2e8f0; }
    .client-card.completo { background-color: #f0fdf4 !important; border: 1.5px solid #86efac; }
    .client-card.despachado { background-color: #f8fafc !important; opacity: 0.85; border: 1px solid #cbd5e1; }

    .card-main { display: flex; align-items: flex-start; justify-content: space-between; cursor: pointer; }
    .card-left { display: flex; align-items: flex-start; gap: 12px; width: 100%; }
    .icon-circle { width: 42px; height: 42px; border-radius: 12px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 1.1em; flex-shrink: 0; }
    
    .client-header-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .client-name { font-weight: 800; font-size: 0.95em; color: var(--text-dark); text-transform: uppercase; }

    .active-tags-header { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .tag-badge { font-size: 0.68em; font-weight: 800; padding: 3px 8px; border-radius: 8px; background: #0284c7; color: white; display: inline-flex; align-items: center; gap: 4px; }
    .tag-badge.despachado { background: #16a34a; }
    .tag-badge.acumular { background: #d97706; }

    .client-meta { font-size: 0.75em; color: var(--text-muted); margin-top: 2px; font-weight: 600; }

    .comp-container { display: none; margin-top: 14px; padding-top: 12px; border-top: 1px solid #e2e8f0; flex-direction: column; gap: 12px; }
    .comp-container.active { display: flex; }

    .comp-card { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 14px; padding: 12px; }
    .comp-card.completo { background-color: var(--status-completed-bg); border-color: var(--status-completed-border); }

    .comp-header { display: flex; justify-content: space-between; align-items: flex-start; cursor: pointer; }
    .comp-title { font-size: 0.85em; font-weight: 800; color: var(--primary-dark); }

    .options-bar-bottom { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; padding-top: 8px; border-top: 1px dashed #cbd5e1; }
    .btn-option-tag { font-size: 0.7em; font-weight: 700; padding: 5px 8px; border-radius: 8px; border: 1px solid #cbd5e1; background: #ffffff; color: #475569; cursor: pointer; }
    .btn-option-tag.active { background: #0284c7; color: white; border-color: #0369a1; }
    .btn-option-tag.active.despachado { background: #16a34a; border-color: #15803d; }
    .btn-option-tag.active.acumular { background: #d97706; border-color: #b45309; }

    .items-container { display: none; margin-top: 10px; padding-top: 8px; border-top: 1px solid #e2e8f0; flex-direction: column; gap: 8px; }
    .items-container.active { display: flex; }

    .item-tap-card { background: #ffffff; border-radius: 10px; padding: 10px; border: 1.5px solid #cbd5e1; cursor: pointer; }
    .item-tap-card.picked { background: #dcfce7; border-color: #16a34a; }

    .item-title { font-weight: 800; font-size: 0.85em; color: var(--primary-dark); text-transform: uppercase; margin-bottom: 2px; }
    .item-sub-info { display: flex; justify-content: space-between; font-size: 0.75em; font-weight: 700; color: var(--text-muted); }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
    .modal-overlay.active { display: flex; }
    .modal-card { background: #ffffff; border-radius: 24px; padding: 24px; width: 90%; max-width: 440px; text-align: center; }

    .modal-actions { display: flex; gap: 10px; margin-top: 12px; }
    .btn-modal { flex: 1; padding: 12px; border-radius: 12px; font-weight: 700; border: none; cursor: pointer; font-size: 0.85em; }
    .btn-confirm { background: var(--accent-blue); color: white; }
    .btn-cancel { background: #f1f5f9; color: var(--text-dark); }

    .toast-notification {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); background: rgba(15, 23, 42, 0.95);
      color: #ffffff; padding: 14px 28px; border-radius: 30px; font-weight: 700; font-size: 0.9em; opacity: 0; visibility: hidden; transition: all 0.25s ease; z-index: 2000;
    }
    .toast-notification.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
    .date-picker-modal { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 1em; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- PANTALLA PIN -->
  <div class="pin-screen" id="pinScreen">
    <div class="pin-card">
      <img src="https://lh3.googleusercontent.com/d/15UU95djdzlxZErpFFqwHfXPMukffnN-f" class="app-logo-pin" alt="Logo">
      <div style="font-size:0.8em; font-weight:800; color:var(--brand-orange); margin-bottom:4px;">SISTEMA DE PICKING</div>
      <h3 style="margin:0 0 12px 0;">Ingrese PIN de Acceso</h3>
      <input type="password" id="inputPin" class="pin-input" maxlength="4" placeholder="••••" onkeyup="if(event.key==='Enter') verificarPin()">
      <button class="pin-btn" onclick="verificarPin()">INGRESAR</button>
      <div class="pin-error" id="pinError">❌ PIN Incorrecto</div>
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="app-content" id="appContent">
    <div class="header-brand">
      <div class="header-logo-container">
        <img src="https://lh3.googleusercontent.com/d/15UU95djdzlxZErpFFqwHfXPMukffnN-f" class="header-logo-img" alt="Logo">
        <div>
          <div class="company-name">SISTEMA DE PICKING</div>
          <div class="header-title">CONTROL POR CLIENTE</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="btnInstalarApp" class="btn-install" onclick="instalarPWA()">📲 INSTALAR</button>
        <button class="btn-upload" onclick="document.getElementById('fileExcel').click()">➕ EXCEL</button>
      </div>
      <input type="file" id="fileExcel" accept=".xlsx, .xls" style="display:none" onchange="procesarExcel(this)">
    </div>

    <div class="progress-card">
      <div class="progress-text">
        <span>PROGRESO (FILTRADO)</span>
        <span id="progressStats">0 / 0 ÍTEMS | 0 COMPROBANTES</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <div class="search-section">
      <div class="search-input-box">
        <input type="text" id="txtBuscar" placeholder="🔍 Buscar cliente, producto, DNI o comprobante..." oninput="aplicarFiltros()">
      </div>
      
      <div class="filter-controls-row">
        <label class="checkbox-filter">
          <input type="checkbox" id="chkAutoFilter" checked onchange="aplicarFiltros()">
          <span>⚡ Último Día / No Despachados</span>
        </label>

        <div class="filter-control-group">
          <span>🏷️ Etiqueta:</span>
          <select id="filterTag" onchange="aplicarFiltros()">
            <option value="">TODAS</option>
            <option value="proximoDespacho">📅 Próximo Despacho</option>
            <option value="acumular">📦 Acumular</option>
            <option value="delivery">🛵 Delivery</option>
            <option value="recojoLocal">🏪 Recojo en Local</option>
            <option value="despachado">🚀 Despachado</option>
            <option value="sinEtiqueta">⚪ Sin Etiqueta</option>
          </select>
        </div>

        <div class="filter-control-group">
          <span>📅 Emisión:</span>
          <input type="date" id="filterFechaDesde" onchange="aplicarFiltros()">
          <span>a</span>
          <input type="date" id="filterFechaHasta" onchange="aplicarFiltros()">
        </div>

        <div class="filter-control-group">
          <span>🚚 F. Próx. Despacho:</span>
          <input type="date" id="filterFechaDespacho" onchange="aplicarFiltros()">
        </div>

        <button class="btn-clear-filters" onclick="limpiarFiltros()">🧹 Limpiar Filtros</button>
      </div>
    </div>

    <div class="client-list" id="listaClientes">Cargando datos...</div>
  </div>

  <!-- MODAL PARA CONFIRMAR ITEM O INGRESAR FECHA -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <div style="font-size:0.8em; font-weight:800; color:var(--brand-orange);" id="modalTag">CONFIRMAR PRODUCTO</div>
      <div style="font-size: 1.15em; font-weight:800; margin:8px 0; color:var(--primary-dark);" id="modalProductName">PRODUCTO</div>
      <div id="modalProductMeta" style="font-size: 0.85em; text-align:left; margin:10px 0;">Detalles...</div>
      
      <div class="modal-actions" id="modalActions">
        <button class="btn-modal btn-cancel" onclick="cerrarModal(false)">CANCELAR</button>
        <button class="btn-modal btn-confirm" id="btnModalConfirm" onclick="cerrarModal(true)">CONFIRMAR</button>
      </div>
    </div>
  </div>

  <div class="toast-notification" id="toastNotification">✓ ACTUALIZADO</div>

  <script>
    const URL_API = "https://script.google.com/macros/s/AKfycbzgfhVbc7d2r3SSjWVpeuTbSkFxAWpBgTnSw47Jnc9m-KEvpm2UADNT0ezcbUNubd9Y/exec";

    let productosGlobales = [];
    let itemsFiltradosGlobal = [];
    let accionPendiente = null;
    let acordeonesClientes = new Set();
    let acordeonesComprobantes = new Set();
    let estadoEtiquetasComprobantes = {}; 
    let ultimaFechaGeneral = "";
    let deferredPrompt = null;

    // REGISTRO DE SERVICE WORKER PARA PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('activate', e => self.clients.claim());
          self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
        `;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(err => console.log('SW Error:', err));
      });
    }

    // CAPTURA DE EVENTO PARA INSTALAR COMO APP
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btnInstalar = document.getElementById('btnInstalarApp');
      if (btnInstalar) btnInstalar.style.display = 'inline-block';
    });

    async function instalarPWA() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        document.getElementById('btnInstalarApp').style.display = 'none';
      }
      deferredPrompt = null;
    }

    function verificarPin() {
      const pin = document.getElementById('inputPin').value;
      if (pin === "1312") {
        document.getElementById('pinScreen').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
        cargarDatos();
      } else {
        document.getElementById('pinError').style.display = 'block';
        document.getElementById('inputPin').value = '';
      }
    }

    async function procesarExcel(input) {
      const file = input.files[0];
      if (!file) return;

      mostrarToast("⌛ Leyendo archivo Excel...");

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const jsonFilas = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

          if (jsonFilas.length === 0) {
            alert("El archivo Excel no contiene filas de datos.");
            return;
          }

          mostrarToast("🚀 Enviando datos al servidor...");

          const res = await fetch(URL_API, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
              accion: "AGREGAR_EXCEL",
              filas: jsonFilas
            })
          });

          const respJson = await res.json();
          if (respJson.status === 'ok') {
            mostrarToast("✓ EXCEL PROCESADO CON ÉXITO");
            cargarDatos();
          } else {
            alert("Ocurrió un error al guardar en Google Sheets.");
          }
        } catch (err) {
          console.error(err);
          alert("Error al procesar el archivo Excel: " + err.message);
        } finally {
          input.value = "";
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function normalizarKeyClient(val) {
      return String(val || 'GENERAL').trim().toLowerCase().replace(/[^a-z0-9]/g, '_');
    }

    function normalizarKeyComp(val) {
      return String(val || 'SIN_COMPROBANTE').trim().toUpperCase().replace(/[^A-Z0-9]/g, '_');
    }

    function normalizarFechaISO(f) {
      if (!f) return "";
      let str = String(f).trim();
      
      if (str.includes("/")) {
        const parts = str.split("/");
        if (parts.length === 3) return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
      }

      if (str.length > 10 || str.includes("GMT")) {
        const d = new Date(str);
        if (!isNaN(d.getTime())) {
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          return `${yyyy}-${mm}-${dd}`;
        }
      }

      if (str.includes("T")) str = str.split("T")[0];
      return str;
    }

    function formatearEspañolDDMMAAAA(fISO) {
      const iso = normalizarFechaISO(fISO);
      if (!iso || !iso.includes("-")) return iso || "S/F";
      const partes = iso.split("-");
      if (partes.length === 3) {
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
      }
      return iso;
    }

    async function cargarDatos() {
      try {
        const res = await fetch(URL_API);
        const data = await res.json();

        if (data.error) {
          document.getElementById('listaClientes').innerText = "Error Google Sheets: " + data.error;
          return;
        }

        productosGlobales = data;
        
        ultimaFechaGeneral = "";
        productosGlobales.forEach(item => {
          const fStr = normalizarFechaISO(item.fecha);
          if (fStr > ultimaFechaGeneral) ultimaFechaGeneral = fStr;

          const keyComp = normalizarKeyComp(item.comprobante);
          if (!estadoEtiquetasComprobantes[keyComp]) {
            const tagsArray = item.etiquetas ? item.etiquetas.split(",") : [];
            estadoEtiquetasComprobantes[keyComp] = {
              proximoDespacho: tagsArray.includes("proximoDespacho"),
              fechaDespacho: item.fechaDespacho || "",
              acumular: tagsArray.includes("acumular"),
              delivery: tagsArray.includes("delivery"),
              recojoLocal: tagsArray.includes("recojoLocal"),
              despachado: tagsArray.includes("despachado")
            };
          }
        });

        aplicarFiltros();
      } catch(e) {
        document.getElementById('listaClientes').innerText = "Error cargando la lista de productos: " + e.message;
      }
    }

    function actualizarBarraProgreso(itemsFiltrados) {
      const setComprobantes = new Set();
      let completados = 0;

      itemsFiltrados.forEach(i => {
        if (i.comprobante) setComprobantes.add(String(i.comprobante).trim().toUpperCase());
        if (Number(i.cantPickeada) >= Number(i.cantSolicitada)) completados++;
      });

      const total = itemsFiltrados.length;
      const totalComprobantes = setComprobantes.size;
      const porcentaje = total > 0 ? Math.round((completados / total) * 100) : 0;

      document.getElementById('progressStats').innerText = `${completados} / ${total} ÍTEMS (${porcentaje}%) | ${totalComprobantes} COMPROBANTES`;
      document.getElementById('progressBar').style.width = `${porcentaje}%`;
    }

    function aplicarFiltros() {
      const texto = document.getElementById('txtBuscar').value.toLowerCase().trim();
      const tagSeleccionada = document.getElementById('filterTag').value;
      const fechaDesde = document.getElementById('filterFechaDesde').value;
      const fechaHasta = document.getElementById('filterFechaHasta').value;
      const fechaDespachoFiltro = document.getElementById('filterFechaDespacho').value;
      const autoFiltrarUltimoDia = document.getElementById('chkAutoFilter').checked;

      itemsFiltradosGlobal = productosGlobales.filter(item => {
        const keyComp = normalizarKeyComp(item.comprobante);
        const state = estadoEtiquetasComprobantes[keyComp] || {};
        const fechaItem = normalizarFechaISO(item.fecha);

        if (autoFiltrarUltimoDia) {
          const esUltimoDia = (fechaItem === ultimaFechaGeneral);
          const noDespachado = !state.despachado;
          if (!esUltimoDia && !noDespachado) return false;
        }

        const coincideTexto = !texto || 
          (item.cliente && item.cliente.toLowerCase().includes(texto)) ||
          (item.docCliente && String(item.docCliente).includes(texto)) ||
          (item.producto && item.producto.toLowerCase().includes(texto)) ||
          (item.comprobante && String(item.comprobante).toLowerCase().includes(texto));

        let coincideTag = true;
        if (tagSeleccionada === 'sinEtiqueta') {
          coincideTag = !state.proximoDespacho && !state.acumular && !state.delivery && !state.recojoLocal && !state.despachado;
        } else if (tagSeleccionada) {
          coincideTag = !!state[tagSeleccionada];
        }

        let coincideFecha = true;
        if (fechaDesde && fechaItem) coincideFecha = coincideFecha && (fechaItem >= fechaDesde);
        if (fechaHasta && fechaItem) coincideFecha = coincideFecha && (fechaItem <= fechaHasta);

        let coincideFechaDespacho = true;
        if (fechaDespachoFiltro) {
          const fDespState = normalizarFechaISO(state.fechaDespacho);
          coincideFechaDespacho = state.proximoDespacho && (fDespState === fechaDespachoFiltro);
        }

        return coincideTexto && coincideTag && coincideFecha && coincideFechaDespacho;
      });

      actualizarBarraProgreso(itemsFiltradosGlobal);
      agruparPorClienteYComprobante(itemsFiltradosGlobal);
    }

    function limpiarFiltros() {
      document.getElementById('txtBuscar').value = '';
      document.getElementById('filterTag').value = '';
      document.getElementById('filterFechaDesde').value = '';
      document.getElementById('filterFechaHasta').value = '';
      document.getElementById('filterFechaDespacho').value = '';
      document.getElementById('chkAutoFilter').checked = true;
      aplicarFiltros();
    }

    function agruparPorClienteYComprobante(data) {
      const mapaClientes = {};

      data.forEach(item => {
        const keyClient = normalizarKeyClient(item.docCliente || item.cliente);
        const keyComp = normalizarKeyComp(item.comprobante);

        if (!mapaClientes[keyClient]) {
          mapaClientes[keyClient] = {
            keyClient: keyClient,
            docCliente: item.docCliente || 'S/D',
            cliente: item.cliente || 'CLIENTE GENERAL',
            comprobantesMap: {}
          };
        }

        if (!mapaClientes[keyClient].comprobantesMap[keyComp]) {
          mapaClientes[keyClient].comprobantesMap[keyComp] = {
            keyComp: keyComp,
            comprobanteOriginal: item.comprobante || 'S/C',
            fecha: item.fecha,
            importeTotal: 0,
            items: []
          };
        }

        mapaClientes[keyClient].comprobantesMap[keyComp].importeTotal += Number(item.importe || 0);
        mapaClientes[keyClient].comprobantesMap[keyComp].items.push(item);
      });

      const listaClientes = Object.values(mapaClientes).map(clienteObj => {
        const comprobantesList = Object.values(clienteObj.comprobantesMap).map(compObj => {
          const totalItemsComp = compObj.items.length;
          const completadosComp = compObj.items.filter(i => Number(i.cantPickeada) >= Number(i.cantSolicitada)).length;
          const stateComp = estadoEtiquetasComprobantes[compObj.keyComp] || {};

          let prioridadComp = 1; 
          if (stateComp.despachado) {
            prioridadComp = 3; 
          } else if (totalItemsComp > 0 && totalItemsComp === completadosComp) {
            prioridadComp = 2; 
          }

          return {
            ...compObj,
            totalItems: totalItemsComp,
            completados: completadosComp,
            esCompleto: totalItemsComp > 0 && totalItemsComp === completadosComp,
            esDespachado: !!stateComp.despachado,
            prioridad: prioridadComp
          };
        });

        comprobantesList.sort((a, b) => a.prioridad - b.prioridad);

        const totalItemsCli = comprobantesList.reduce((acc, c) => acc + c.totalItems, 0);
        const completadosCli = comprobantesList.reduce((acc, c) => acc + c.completados, 0);
        const esCliDespachado = comprobantesList.length > 0 && comprobantesList.every(c => c.esDespachado);
        const esCliCompleto = totalItemsCli > 0 && totalItemsCli === completadosCli;

        let prioridadCli = 1; 
        if (esCliDespachado) {
          prioridadCli = 3; 
        } else if (esCliCompleto) {
          prioridadCli = 2; 
        }

        return {
          ...clienteObj,
          comprobantes: comprobantesList,
          totalItems: totalItemsCli,
          completados: completadosCli,
          esCompleto: esCliCompleto,
          esDespachado: esCliDespachado,
          prioridad: prioridadCli
        };
      });

      listaClientes.sort((a, b) => a.prioridad - b.prioridad);

      renderizarListaJerarquica(listaClientes);
    }

    function renderizarListaJerarquica(clientes) {
      const container = document.getElementById('listaClientes');
      container.innerHTML = '';

      if (clientes.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">No hay resultados para el filtro actual.</div>';
        return;
      }

      clientes.forEach(cli => {
        const clienteAbierto = acordeonesClientes.has(cli.keyClient);

        let claseCardCli = '';
        if (cli.esDespachado) claseCardCli = 'despachado';
        else if (cli.esCompleto) claseCardCli = 'completo';

        let htmlComprobantes = '';
        cli.comprobantes.forEach(comp => {
          const compAbierto = acordeonesComprobantes.has(comp.keyComp);
          const stateComp = estadoEtiquetasComprobantes[comp.keyComp] || {};

          let claseComp = '';
          if (comp.esDespachado) claseComp = 'despachado';
          else if (comp.esCompleto) claseComp = 'completo';

          let htmlItems = '';
          comp.items.forEach(item => {
            const esPicked = Number(item.cantPickeada) >= Number(item.cantSolicitada);
            htmlItems += `
              <div class="item-tap-card ${esPicked ? 'picked' : ''}" id="item-card-${item.fila}">
                <div onclick="confirmarToqueItem(${item.fila}, '${item.producto.replace(/'/g, "\\'")}', ${item.cantSolicitada}, '${item.codigo}', '${cli.keyClient}', '${comp.keyComp}')">
                  <div class="item-title" id="item-title-${item.fila}">${esPicked ? '✅' : '📦'} ${item.producto}</div>
                  <div class="item-sub-info">
                    <span>CÓD: ${item.codigo || '—'}</span>
                    <span>CANT: ${item.cantSolicitada} ${item.unidad || 'EA'}</span>
                  </div>
                </div>
              </div>
            `;
          });

          let badgesCompHtml = '';
          if (stateComp.proximoDespacho) badgesCompHtml += `<span class="tag-badge">📅 PRÓX. DESPACHO (${formatearEspañolDDMMAAAA(stateComp.fechaDespacho)})</span>`;
          if (stateComp.acumular) badgesCompHtml += `<span class="tag-badge acumular">📦 ACUMULAR</span>`;
          if (stateComp.delivery) badgesCompHtml += `<span class="tag-badge">🛵 DELIVERY</span>`;
          if (stateComp.recojoLocal) badgesCompHtml += `<span class="tag-badge">🏪 RECOJO EN LOCAL</span>`;
          if (stateComp.despachado) badgesCompHtml += `<span class="tag-badge despachado">🚀 DESPACHADO</span>`;

          htmlComprobantes += `
            <div class="comp-card ${claseComp}" id="card-comp-${comp.keyComp}">
              <div class="comp-header" onclick="toggleAcordeonComprobante('${comp.keyComp}')">
                <div>
                  <div class="comp-title">📄 COMPROBANTE: ${comp.comprobanteOriginal} (${formatearEspañolDDMMAAAA(comp.fecha)})</div>
                  <div class="client-meta">TOTAL: S/ ${comp.importeTotal.toFixed(2)} | PROGRESO: ${comp.completados}/${comp.totalItems} ÍTEMS</div>
                  <div class="active-tags-header" style="margin-top:4px;">${badgesCompHtml}</div>
                </div>
                <div style="font-size:0.8em; color:var(--text-muted);">${compAbierto ? '▲' : '▼'}</div>
              </div>

              <div class="options-bar-bottom">
                <button class="btn-option-tag ${stateComp.proximoDespacho ? 'active' : ''}" onclick="toggleTag('${comp.keyComp}', 'proximoDespacho')">📅 Próx. Despacho</button>
                <button class="btn-option-tag ${stateComp.acumular ? 'active acumular' : ''}" onclick="toggleTag('${comp.keyComp}', 'acumular')">📦 Acumular</button>
                <button class="btn-option-tag ${stateComp.delivery ? 'active' : ''}" onclick="toggleTag('${comp.keyComp}', 'delivery')">🛵 Delivery</button>
                <button class="btn-option-tag ${stateComp.recojoLocal ? 'active' : ''}" onclick="toggleTag('${comp.keyComp}', 'recojoLocal')">🏪 Recojo Local</button>
                <button class="btn-option-tag ${stateComp.despachado ? 'active despachado' : ''}" onclick="toggleTag('${comp.keyComp}', 'despachado')">🚀 Despachado</button>
              </div>

              <div class="items-container ${compAbierto ? 'active' : ''}" id="container-items-${comp.keyComp}">
                ${htmlItems}
              </div>
            </div>
          `;
        });

        const cliCard = document.createElement('div');
        cliCard.className = `client-card ${claseCardCli}`;
        cliCard.id = `card-client-${cli.keyClient}`;
        cliCard.innerHTML = `
          <div class="card-main" onclick="toggleAcordeonCliente('${cli.keyClient}')">
            <div class="card-left">
              <div class="icon-circle">👤</div>
              <div style="flex:1;">
                <div class="client-header-title">
                  <span class="client-name">${cli.cliente}</span>
                  <span style="font-size:0.75em; color:var(--text-muted);">(${cli.docCliente})</span>
                </div>
                <div class="client-meta">COMPROBANTES: ${cli.comprobantes.length} | PROGRESO: ${cli.completados}/${cli.totalItems} ÍTEMS</div>
              </div>
            </div>
            <div style="font-size:0.8em; color:var(--text-muted); align-self:center;">${clienteAbierto ? '▲' : '▼'}</div>
          </div>

          <div class="comp-container ${clienteAbierto ? 'active' : ''}" id="container-comp-${cli.keyClient}">
            ${htmlComprobantes}
          </div>
        `;
        container.appendChild(cliCard);
      });
    }

    function toggleAcordeonCliente(keyClient) {
      if (acordeonesClientes.has(keyClient)) {
        acordeonesClientes.delete(keyClient);
      } else {
        acordeonesClientes.add(keyClient);
      }
      const el = document.getElementById(`container-comp-${keyClient}`);
      if (el) el.classList.toggle('active');
    }

    function toggleAcordeonComprobante(keyComp) {
      if (acordeonesComprobantes.has(keyComp)) {
        acordeonesComprobantes.delete(keyComp);
      } else {
        acordeonesComprobantes.add(keyComp);
      }
      const el = document.getElementById(`container-items-${keyComp}`);
      if (el) el.classList.toggle('active');
    }

    function confirmarToqueItem(fila, nombreProd, cantReq, codigo, keyClient, keyComp) {
      const item = productosGlobales.find(p => p.fila === fila);
      if (!item) return;

      const esPickedActualmente = Number(item.cantPickeada) >= Number(item.cantSolicitada);
      const nuevaCant = esPickedActualmente ? 0 : cantReq;

      document.getElementById('modalTag').innerText = esPickedActualmente ? "DESMARCAR PRODUCTO" : "MARCAR PRODUCTO";
      document.getElementById('modalProductName').innerText = nombreProd;
      document.getElementById('modalProductMeta').innerHTML = `
        <b>CÓDIGO:</b> ${codigo || '—'}<br>
        <b>CANTIDAD:</b> ${cantReq} ${item.unidad || 'EA'}<br>
        <b>ACCIÓN:</b> ${esPickedActualmente ? 'Marcar como PENDIENTE' : 'Marcar como PICKEADO'}
      `;

      document.getElementById('btnModalConfirm').innerText = esPickedActualmente ? "DESMARCAR" : "CONFIRMAR PICKEADO";

      accionPendiente = async () => {
        item.cantPickeada = nuevaCant;
        
        // Actualización Visual Inmediata
        const cardElem = document.getElementById(`item-card-${fila}`);
        const titleElem = document.getElementById(`item-title-${fila}`);
        if (cardElem && titleElem) {
          if (nuevaCant >= cantReq) {
            cardElem.classList.add('picked');
            titleElem.innerText = `✅ ${nombreProd}`;
          } else {
            cardElem.classList.remove('picked');
            titleElem.innerText = `📦 ${nombreProd}`;
          }
        }

        actualizarBarraProgreso(itemsFiltradosGlobal);
        agruparPorClienteYComprobante(itemsFiltradosGlobal);

        // Envío en segundo plano
        try {
          await fetch(URL_API, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
              accion: "ACTUALIZAR_CANTIDAD",
              fila: fila,
              cantPickeada: nuevaCant
            })
          });
          mostrarToast("✓ ESTADO ACTUALIZADO");
        } catch (e) {
          console.error(e);
          mostrarToast("⚠️ ERROR DE CONEXIÓN AL GUARDAR");
        }
      };

      document.getElementById('modalOverlay').classList.add('active');
    }

    async function toggleTag(keyComp, tagNombre) {
      if (!estadoEtiquetasComprobantes[keyComp]) {
        estadoEtiquetasComprobantes[keyComp] = { proximoDespacho: false, fechaDespacho: "", acumular: false, delivery: false, recojoLocal: false, despachado: false };
      }

      const current = estadoEtiquetasComprobantes[keyComp];

      if (tagNombre === 'proximoDespacho') {
        if (!current.proximoDespacho) {
          // Solicitar fecha de despacho mediante el modal
          document.getElementById('modalTag').innerText = "PROGRAMAR DESPACHO";
          document.getElementById('modalProductName').innerText = "Seleccione Fecha de Despacho";
          document.getElementById('modalProductMeta').innerHTML = `
            <input type="date" id="inputFechaDespachoModal" class="date-picker-modal" value="${new Date().toISOString().split('T')[0]}">
          `;
          document.getElementById('btnModalConfirm').innerText = "GUARDAR FECHA";

          accionPendiente = () => {
            const fechaInput = document.getElementById('inputFechaDespachoModal').value;
            if (!fechaInput) return;
            current.proximoDespacho = true;
            current.fechaDespacho = fechaInput;
            guardarEstadoEtiquetas(keyComp);
          };

          document.getElementById('modalOverlay').classList.add('active');
          return;
        } else {
          current.proximoDespacho = false;
          current.fechaDespacho = "";
        }
      } else {
        current[tagNombre] = !current[tagNombre];
      }

      guardarEstadoEtiquetas(keyComp);
    }

    async function guardarEstadoEtiquetas(keyComp) {
      const state = estadoEtiquetasComprobantes[keyComp];
      
      const tagsArray = [];
      if (state.proximoDespacho) tagsArray.push("proximoDespacho");
      if (state.acumular) tagsArray.push("acumular");
      if (state.delivery) tagsArray.push("delivery");
      if (state.recojoLocal) tagsArray.push("recojoLocal");
      if (state.despachado) tagsArray.push("despachado");

      const etiquetasString = tagsArray.join(",");
      const fechaDespachoString = state.fechaDespacho || "";

      // Actualizar visualmente la interfaz
      aplicarFiltros();

      try {
        mostrarToast("💾 Guardando etiquetas...");
        await fetch(URL_API, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            accion: "ACTUALIZAR_ETIQUETAS_COMPROBANTE",
            comprobanteKey: keyComp,
            etiquetas: etiquetasString,
            fechaDespacho: fechaDespachoString
          })
        });
        mostrarToast("✓ ETIQUETAS GUARDADAS");
      } catch (e) {
        console.error(e);
        mostrarToast("⚠️ ERROR AL GUARDAR ETIQUETAS");
      }
    }

    function cerrarModal(confirmado) {
      document.getElementById('modalOverlay').classList.remove('active');
      if (confirmado && typeof accionPendiente === 'function') {
        accionPendiente();
      }
      accionPendiente = null;
    }

    function mostrarToast(mensaje) {
      const toast = document.getElementById('toastNotification');
      toast.innerText = mensaje;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }
  </script>
</body>
